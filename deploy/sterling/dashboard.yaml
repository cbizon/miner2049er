# Read-only benchmark dashboard. Not exposed outside the namespace; view it with
#   kubectl port-forward svc/miner-dashboard 6431:6431   ->  http://localhost:6431
apiVersion: v1
kind: Service
metadata:
  name: miner-dashboard
  labels: {app.kubernetes.io/part-of: miner2049er, app.kubernetes.io/component: dashboard}
spec:
  selector: {app.kubernetes.io/part-of: miner2049er, app.kubernetes.io/component: dashboard}
  ports: [{name: http, port: 6431, targetPort: 6431}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miner-dashboard
  labels: {app.kubernetes.io/part-of: miner2049er, app.kubernetes.io/component: dashboard}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/part-of: miner2049er, app.kubernetes.io/component: dashboard}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: miner2049er, app.kubernetes.io/component: dashboard}
    spec:
      imagePullSecrets: [{name: registry-credentials}]
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        runAsGroup: 7474
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: dashboard
          image: ghcr.io/cbizon/miner2049er:1.0.2-4addf3c@sha256:ea95ddced66408acca18089b51473c32147482aa35ad7a727045f0c382f808c8
          command: [uvicorn, "miner2049er.dashboard_server:APP", --host, 0.0.0.0, --port, "6431"]
          env: [{name: HOME, value: /tmp}]
          ports: [{name: http, containerPort: 6431}]
          readinessProbe:
            httpGet: {path: /, port: 6431}
            periodSeconds: 15
          volumeMounts:
            - {name: work, mountPath: /app/runs, subPath: runs, readOnly: true}
            - {name: work, mountPath: /app/data/evaluations, subPath: evaluations, readOnly: true}
            - {name: work, mountPath: /app/data/rule-set-evaluations, subPath: rule-set-evaluations, readOnly: true}
            - {name: work, mountPath: /app/results/rule-sets, subPath: rule-sets, readOnly: true}
            # Agent controller state, read by miner-debrief to tell whether a night ended cleanly.
            - {name: work, mountPath: /app/agents, subPath: agents, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 1Gi, ephemeral-storage: 50Mi}
            limits: {cpu: "1", memory: 3Gi, ephemeral-storage: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - {name: work, persistentVolumeClaim: {claimName: miner-work, readOnly: true}}
