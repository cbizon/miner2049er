# Settings for the nightly round. Apply once at setup:
#   kubectl apply -f nightly-settings.yaml
# After that, change them on the cluster (the /miner skill sets tonight's
# instruction with scripts/sterling_set_instruction.sh). Re-applying this file
# would overwrite the current instruction.
apiVersion: v1
kind: ConfigMap
metadata:
  name: miner-nightly
  labels: {app.kubernetes.io/part-of: miner2049er, app.kubernetes.io/component: nightly}
data:
  run_id: sterling-2026-11-05
  model: claude-opus-5-5
  effort: high
  deadline_hours: "7"
  # The date (America/New_York) instruction.md was written for. If it isn't
  # tonight's date, the night runs fallback.md instead of repeating a stale
  # instruction. scripts/sterling_set_instruction.sh sets both.
  instruction_for: "2026-11-01"
  fallback.md: |
    No new instruction from the operator for tonight. Continue from your
    previous round's final summary: pursue your top-ranked proposed direction,
    and apply your stated default to every question the operator did not answer.
    Gandalf/TRAPI is not deployed: skip its checks and say so in limitations.
    Keep every scratch file, including pickled query pulls, under $TMPDIR and
    never under a literal /tmp: the container's /tmp has a 512Mi disk quota.
  instruction.md: |
    Strip-down audit. For the current best rules on each Pareto surface, drop
    one condition at a time (thresholds, filters, extra hops) and measure the
    effect on training-label statistics only, which costs no feedback budget.
    Keep a simplification when the training lower-bound precision holds up, and
    record each ablation as a research event. Submit to feedback only the few
    simplified rules that survive. Prefer the simpler rule when two are close.
    Gandalf/TRAPI is not deployed: skip its checks and say so in limitations.
