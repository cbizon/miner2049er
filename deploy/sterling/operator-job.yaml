# Operator step for a run: init-run, start-round, finish-round or close-run.
# Mounts the sealed volume read-write; never run the agent with this.
# Render with: sed -e "s/@JOB@/<name>/" -e "s|@ARGS@|<miner-benchmark-setup args>|"
apiVersion: batch/v1
kind: Job
metadata:
  name: @JOB@
  labels: {app.kubernetes.io/part-of: miner2049er, app.kubernetes.io/component: operator}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: miner2049er, app.kubernetes.io/component: operator}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: registry-credentials}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        runAsGroup: 7474
        fsGroup: 7474
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: operator
          image: ghcr.io/cbizon/miner2049er:1.0.2-c842553@sha256:afa5eccf26a7e55e3f7ea06166e56971468675b4860708aec36df3cc212a4c88
          command: [sh, -euc]
          args:
            - >-
              miner-benchmark-setup @ARGS@
              --runs-dir /work/runs --evaluations-dir /work/evaluations
              --public-dir /work/benchmark --sealed-dir /sealed
          env: [{name: HOME, value: /tmp}]
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: sealed, mountPath: /sealed}
          resources:
            requests: {cpu: 100m, memory: 1Gi, ephemeral-storage: 50Mi}
            limits: {cpu: "1", memory: 4Gi, ephemeral-storage: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - {name: work, persistentVolumeClaim: {claimName: miner-work}}
        - {name: sealed, persistentVolumeClaim: {claimName: miner-sealed}}
