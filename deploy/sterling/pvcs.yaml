# Storage for the Translator 1.0.2 benchmark on Sterling (namespace quota 128Gi).
# Total requested: 61Gi. All classes allow expansion.
# Neo4j's store is not here: every class is NFS, which Neo4j can't import onto,
# so it lives in memory for now (see neo4j.yaml).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: miner-source
  labels: {app.kubernetes.io/part-of: miner2049er, app.kubernetes.io/component: source}
spec:
  # nodes.jsonl.zst + edges.jsonl.zst (4.0GB measured) plus the 3.4GB archive
  # while splitting.
  accessModes: [ReadWriteOnce]
  storageClassName: basic
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: miner-sealed
  labels: {app.kubernetes.io/part-of: miner2049er, app.kubernetes.io/component: sealed}
spec:
  # Feedback and final labels. Mounted only by the build Job and, later, the scorer.
  accessModes: [ReadWriteMany]
  storageClassName: encrypted
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: miner-work
  labels: {app.kubernetes.io/part-of: miner2049er, app.kubernetes.io/component: work}
spec:
  # Public split artifacts (training labels), run directories, evaluations.
  accessModes: [ReadWriteMany]
  storageClassName: basic
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: miner-import
  labels: {app.kubernetes.io/part-of: miner2049er, app.kubernetes.io/component: import}
spec:
  # Parquet handed to neo4j-admin (3.6GB for full 1.0.2, measured locally).
  # Delete this PVC after the import succeeds.
  accessModes: [ReadWriteOnce]
  storageClassName: basic
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: miner-gandalf
  labels: {app.kubernetes.io/part-of: miner2049er, app.kubernetes.io/component: gandalf}
spec:
  # Published Gandalf mmap store (build-gandalf-job.yaml), served read-only by
  # gandalf.yaml. Expect 20-30GB; the class allows expansion if it is larger.
  accessModes: [ReadWriteMany]
  storageClassName: basic
  resources: {requests: {storage: 30Gi}}
