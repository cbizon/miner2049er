# One-shot Gandalf store build, published to miner-gandalf for gandalf.yaml.
#
# The held-out split is the same one Neo4j uses: build-stores --stores gandalf
# drops every target-closure edge whose pair is in the sealed feedback or final
# labels (graph_filter.edge_is_visible, shared with the Neo4j export). Like the
# existing build, only this Job and the operator Jobs mount miner-sealed.
#
#   1. build: graph -> mmap store on a local NVMe scratch volume. LMDB is
#      written here, not on NFS (Neo4j's import already failed on NFS).
#   2. check: serve the scratch store on localhost and require over TRAPI that
#      sampled feedback and final pairs are absent and training pairs present.
#   3. publish: copy the checked store to miner-gandalf, then rename it into
#      place, so the server never sees a partial or unchecked store.
# The scratch volume is deleted with the pod. If the store is already
# published, every step skips; to rebuild, delete it from the PVC first.
apiVersion: batch/v1
kind: Job
metadata:
  name: miner-build-gandalf
  labels: {app.kubernetes.io/part-of: miner2049er, app.kubernetes.io/component: build}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: miner2049er, app.kubernetes.io/component: build}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: registry-credentials}]
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        runAsGroup: 7474
        fsGroup: 7474
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: build
          image: &image ghcr.io/cbizon/miner2049er:PIN-ME
          command: [sh, -euc]
          args:
            - |
              if [ -d "/gandalf/$SPLIT" ]; then echo "store already published"; exit 0; fi
              mkdir -p /scratch/tmp
              miner-benchmark-setup build-stores --stores gandalf --store-root /scratch \
                --source-dir /source --public-dir /work/benchmark --sealed-dir /sealed
              du -sh /scratch/gandalf
          env: &env
            - {name: HOME, value: /tmp}
            - {name: TMPDIR, value: /scratch/tmp}
            - {name: SOURCE_COMPRESSION, value: zstd}
            - {name: GRAPH_VERSION, value: "1.0.2"}
            - {name: SPLIT, value: bf9f8f5300edac94}
          volumeMounts: &mounts
            - {name: source, mountPath: /source, readOnly: true}
            - {name: work, mountPath: /work/benchmark, subPath: benchmark, readOnly: true}
            - {name: sealed, mountPath: /sealed, readOnly: true}
            - {name: scratch, mountPath: /scratch}
            - {name: gandalf, mountPath: /gandalf}
          resources:
            requests: {cpu: "2", memory: 24Gi, ephemeral-storage: 100Mi}
            limits: {cpu: "4", memory: 48Gi, ephemeral-storage: 1Gi}
          securityContext: &locked
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
        - name: check
          image: *image
          command: [sh, -euc]
          args:
            - |
              if [ -d "/gandalf/$SPLIT" ]; then echo "store already published"; exit 0; fi
              GANDALF_GRAPH_PATH=/scratch/gandalf GANDALF_GRAPH_FORMAT=mmap \
              GANDALF_LOAD_MMAPS_INTO_MEMORY=false GANDALF_OTEL_ENABLED=false \
                uvicorn miner2049er.gandalf_server:APP --host 127.0.0.1 --port 6429 &
              server=$!
              ready() { python -c 'import httpx; httpx.get("http://127.0.0.1:6429/metadata", timeout=5).raise_for_status()' 2>/dev/null; }
              for i in $(seq 1 120); do
                ready && break
                kill -0 "$server" || { echo "Gandalf exited during startup" >&2; exit 1; }
                sleep 5
              done
              ready || { echo "Gandalf not ready after 10 minutes" >&2; exit 1; }
              miner-check-gandalf-holdout --gandalf-url http://127.0.0.1:6429 \
                --sealed-manifest "/sealed/$SPLIT/sealed-manifest.json" \
                --training-labels "/work/benchmark/$SPLIT/training-labels.jsonl"
              kill "$server"
          env: *env
          volumeMounts: *mounts
          resources:
            requests: {cpu: "1", memory: 8Gi, ephemeral-storage: 100Mi}
            limits: {cpu: "4", memory: 16Gi, ephemeral-storage: 1Gi}
          securityContext: *locked
      containers:
        - name: publish
          image: *image
          command: [sh, -euc]
          args:
            - |
              if [ -d "/gandalf/$SPLIT" ]; then echo "store already published"; exit 0; fi
              rm -rf "/gandalf/$SPLIT.partial"
              cp -a /scratch/gandalf "/gandalf/$SPLIT.partial"
              mv "/gandalf/$SPLIT.partial" "/gandalf/$SPLIT"
              du -sh "/gandalf/$SPLIT"
          env: *env
          volumeMounts:
            - {name: scratch, mountPath: /scratch, readOnly: true}
            - {name: gandalf, mountPath: /gandalf}
          resources:
            requests: {cpu: 500m, memory: 1Gi, ephemeral-storage: 50Mi}
            limits: {cpu: "2", memory: 4Gi, ephemeral-storage: 256Mi}
          securityContext: *locked
      volumes:
        - {name: source, persistentVolumeClaim: {claimName: miner-source, readOnly: true}}
        - {name: sealed, persistentVolumeClaim: {claimName: miner-sealed, readOnly: true}}
        - {name: work, persistentVolumeClaim: {claimName: miner-work, readOnly: true}}
        - {name: gandalf, persistentVolumeClaim: {claimName: miner-gandalf}}
        - name: scratch
          ephemeral:
            volumeClaimTemplate:
              metadata:
                labels: {app.kubernetes.io/part-of: miner2049er, app.kubernetes.io/component: build}
              spec:
                # Temp + sorted edge LMDBs (each >16GB for a 29M-edge graph)
                # coexist during the build. Namespace nvme quota is 60Gi.
                accessModes: [ReadWriteOnce]
                storageClassName: nvme-ephemeral
                resources: {requests: {storage: 55Gi}}
