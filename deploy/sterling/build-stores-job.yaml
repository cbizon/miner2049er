# One-shot build: fetch 1.0.2 -> derive 1.0.2.1 -> split labels -> export Parquet.
# 1.0.2.1 is 1.0.2 with stereo-unspecified drug nodes merged into their one
# drug stereoisomer (config/graph-1.0.2.1-replacements.tsv); see
# src/miner2049er/graph_derivation.py. The Parquet on miner-import is what the
# Neo4j pod imports from (see neo4j.yaml).
# Each step skips work a previous attempt finished, so the Job can be rerun
# (delete and re-apply) after a failure without starting over.
# miner-source and miner-import are RWO: the Job must land on the node holding
# them, so stop Neo4j (scale to 0) before applying, and pin the node below if
# another pod has miner-source attached.
apiVersion: batch/v1
kind: Job
metadata:
  name: miner-build-stores
  labels: {app.kubernetes.io/part-of: miner2049er, app.kubernetes.io/component: build}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: miner2049er, app.kubernetes.io/component: build}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: registry-credentials}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        runAsGroup: 7474
        fsGroup: 7474
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: fetch-source
          image: ghcr.io/cbizon/miner2049er:1.0.2.1-554e02d@sha256:008cde0c554cc897ef3fc6917718b92a8cdd5e836570229a83f5e7319efa0205
          command: [sh, -euc]
          args:
            - |
              if [ -f /source/source-manifest.json ]; then
                echo "source already fetched"; cat /source/source-manifest.json
              else
                miner-fetch-source --url "$RELEASE_URL" --output-dir /source --graph-version 1.0.2
              fi
          env:
            - {name: RELEASE_URL, value: "https://kgx-storage.ci.transltr.io/releases/translator_kg/1.0.2/translator_kg.tar.zst"}
            - {name: HOME, value: /tmp}
          volumeMounts: [{name: source, mountPath: /source}]
          resources: &python
            requests: {cpu: 500m, memory: 4Gi, ephemeral-storage: 100Mi}
            limits: {cpu: "4", memory: 8Gi, ephemeral-storage: 1Gi}
          securityContext: &locked
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
        - name: derive-graph
          image: ghcr.io/cbizon/miner2049er:1.0.2.1-554e02d@sha256:008cde0c554cc897ef3fc6917718b92a8cdd5e836570229a83f5e7319efa0205
          command: [sh, -euc]
          args:
            - |
              if [ -f "/source/$GRAPH_VERSION/derivation-manifest.json" ]; then
                echo "graph already derived"; cat "/source/$GRAPH_VERSION/derivation-manifest.json"
              else
                miner-derive-graph --source-dir /source \
                  --replacements "/app/config/graph-$GRAPH_VERSION-replacements.tsv" \
                  --output-dir "/source/$GRAPH_VERSION" --graph-version "$GRAPH_VERSION"
              fi
          env: &source_env
            - {name: HOME, value: /tmp}
            - {name: SOURCE_COMPRESSION, value: zstd}
            - {name: GRAPH_VERSION, value: "1.0.2.1"}
          volumeMounts: [{name: source, mountPath: /source}]
          resources: *python
          securityContext: *locked
        - name: prepare-split
          image: ghcr.io/cbizon/miner2049er:1.0.2.1-554e02d@sha256:008cde0c554cc897ef3fc6917718b92a8cdd5e836570229a83f5e7319efa0205
          command: [sh, -euc]
          args:
            - |
              SPLIT=$(python -c 'from miner2049er.benchmark_config import load_benchmark_config as l; print(l().split_id)')
              if [ -f "/sealed/$SPLIT/sealed-manifest.json" ]; then
                echo "split $SPLIT already prepared"
              else
                miner-benchmark-setup prepare --source-dir "/source/$GRAPH_VERSION" \
                  --public-dir /work/benchmark --sealed-dir /sealed
              fi
          env: *source_env
          volumeMounts:
            - {name: source, mountPath: /source, readOnly: true}
            - {name: work, mountPath: /work}
            - {name: sealed, mountPath: /sealed}
          resources: *python
          securityContext: *locked
      containers:
        - name: export-parquet
          image: ghcr.io/cbizon/miner2049er:1.0.2.1-554e02d@sha256:008cde0c554cc897ef3fc6917718b92a8cdd5e836570229a83f5e7319efa0205
          command: [sh, -euc]
          args:
            - |
              if [ "$(cat /import/neo4j-import/graph-version 2>/dev/null)" = "$GRAPH_VERSION" ]; then
                echo "parquet for $GRAPH_VERSION already exported"
              else
                miner-benchmark-setup build-stores --stores neo4j --store-root /import \
                  --source-dir "/source/$GRAPH_VERSION" --public-dir /work/benchmark \
                  --sealed-dir /sealed --overwrite
                echo "$GRAPH_VERSION" > /import/neo4j-import/graph-version
              fi
          env: *source_env
          volumeMounts:
            - {name: source, mountPath: /source, readOnly: true}
            - {name: work, mountPath: /work, readOnly: true}
            - {name: sealed, mountPath: /sealed, readOnly: true}
            - {name: import, mountPath: /import}
          resources: *python
          securityContext: *locked
      volumes:
        - {name: source, persistentVolumeClaim: {claimName: miner-source}}
        - {name: sealed, persistentVolumeClaim: {claimName: miner-sealed}}
        - {name: work, persistentVolumeClaim: {claimName: miner-work}}
        - {name: import, persistentVolumeClaim: {claimName: miner-import}}
