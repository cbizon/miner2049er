# One-shot build: fetch 1.0.2 -> split labels -> export Parquet -> neo4j-admin import.
# Each step skips work a previous attempt finished, so the Job can be rerun
# (delete and re-apply) after a failure without starting over.
apiVersion: batch/v1
kind: Job
metadata:
  name: miner-build-stores
  labels: {app.kubernetes.io/part-of: miner2049er, app.kubernetes.io/component: build}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: miner2049er, app.kubernetes.io/component: build}
    spec:
      restartPolicy: Never
      imagePullSecrets: [{name: registry-credentials}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        runAsGroup: 7474
        fsGroup: 7474
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: fetch-source
          image: ghcr.io/cbizon/miner2049er:1.0.2-92c4e3d@sha256:dfe4af88faed95db863f0c526ac23b173d62c46b30febed75b5449a8abaec3fc
          command: [sh, -euc]
          args:
            - |
              if [ -f /source/source-manifest.json ]; then
                echo "source already fetched"; cat /source/source-manifest.json
              else
                miner-fetch-source --url "$RELEASE_URL" --output-dir /source --graph-version 1.0.2
              fi
          env:
            - {name: RELEASE_URL, value: "https://kgx-storage.ci.transltr.io/releases/translator_kg/1.0.2/translator_kg.tar.zst"}
            - {name: HOME, value: /tmp}
          volumeMounts: [{name: source, mountPath: /source}]
          resources: &python
            requests: {cpu: 500m, memory: 4Gi, ephemeral-storage: 100Mi}
            limits: {cpu: "4", memory: 8Gi, ephemeral-storage: 1Gi}
          securityContext: &locked
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
        - name: prepare-split
          image: ghcr.io/cbizon/miner2049er:1.0.2-92c4e3d@sha256:dfe4af88faed95db863f0c526ac23b173d62c46b30febed75b5449a8abaec3fc
          command: [sh, -euc]
          args:
            - |
              if ls /sealed/*/sealed-manifest.json >/dev/null 2>&1; then
                echo "split already prepared"
              else
                miner-benchmark-setup prepare --source-dir /source \
                  --public-dir /work/benchmark --sealed-dir /sealed
              fi
          env: &source_env
            - {name: HOME, value: /tmp}
            - {name: SOURCE_COMPRESSION, value: zstd}
            - {name: GRAPH_VERSION, value: "1.0.2"}
          volumeMounts:
            - {name: source, mountPath: /source, readOnly: true}
            - {name: work, mountPath: /work}
            - {name: sealed, mountPath: /sealed}
          resources: *python
          securityContext: *locked
        - name: export-parquet
          image: ghcr.io/cbizon/miner2049er:1.0.2-92c4e3d@sha256:dfe4af88faed95db863f0c526ac23b173d62c46b30febed75b5449a8abaec3fc
          command: [sh, -euc]
          args:
            - |
              if [ -f /import/neo4j-import/edges.parquet ]; then
                echo "parquet already exported"
              else
                miner-benchmark-setup build-stores --stores neo4j --store-root /import \
                  --source-dir /source --public-dir /work/benchmark --sealed-dir /sealed
              fi
          env: *source_env
          volumeMounts:
            - {name: source, mountPath: /source, readOnly: true}
            - {name: work, mountPath: /work, readOnly: true}
            - {name: sealed, mountPath: /sealed, readOnly: true}
            - {name: import, mountPath: /import}
          resources: *python
          securityContext: *locked
      containers:
        - name: neo4j-import
          image: neo4j@sha256:d9dd3dc7d1c78fa959191ff02dbdcbefadceaf83eee23428fb92a58cac8ad3fe
          command: [sh, -euc]
          args:
            - |
              if [ -d /data/databases/neo4j ]; then
                echo "Neo4j database already exists; refusing to overwrite" >&2; exit 1
              fi
              mkdir -p /data/logs
              neo4j-admin database import full \
                --input-type=parquet \
                --nodes=/import/neo4j-import/nodes.parquet \
                --relationships=/import/neo4j-import/edges.parquet \
                --id-type=string --strict=true --bad-tolerance=0 --verbose \
                --threads=4 --max-off-heap-memory=8G \
                --report-file=/data/logs/import.report \
                neo4j
              du -sh /data
          env:
            - {name: NEO4J_server_memory_heap_max__size, value: 4G}
            - {name: NEO4J_server_directories_logs, value: /data/logs}
          volumeMounts:
            - {name: import, mountPath: /import, readOnly: true}
            - {name: neo4j-data, mountPath: /data}
          resources:
            requests: {cpu: "1", memory: 14Gi, ephemeral-storage: 100Mi}
            limits: {cpu: "4", memory: 16Gi, ephemeral-storage: 1Gi}
          securityContext: *locked
      volumes:
        - {name: source, persistentVolumeClaim: {claimName: miner-source}}
        - {name: sealed, persistentVolumeClaim: {claimName: miner-sealed}}
        - {name: work, persistentVolumeClaim: {claimName: miner-work}}
        - {name: import, persistentVolumeClaim: {claimName: miner-import}}
        - {name: neo4j-data, persistentVolumeClaim: {claimName: miner-neo4j-data}}
