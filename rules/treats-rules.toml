body = "disease has 3-10 associated genes in a process; chemical decreases activity_or_abundance of >=3; chemical qualified gene degree <=50"
mechanism_score = "medium"
mechanism_rationale = "This is a stricter, hub-resistant multi-target pathway perturbation, but the graph does not establish that decreasing the genes is corrective."
uses_treatment_edges = false
trapi_expressibility = "partial"
trapi_notes = "The graph motif and qualifiers are TRAPI-expressible; cardinality and degree constraints require Cypher or post-processing."
cypher = """
MATCH (object:Disease)-[support:MINER_DISEASE_PROCESS_SUPPORT]->(process)
WHERE support.gene_count >= 3 AND support.gene_count <= 10
MATCH (targeted_gene:Gene)-[:GENE_ASSOCIATED_WITH_CONDITION]->(object)
MATCH (targeted_gene)-[:INVOLVED_IN]->(process)
MATCH (subject:ChemicalEntity)-[effect:AFFECTS]->(targeted_gene)
WHERE effect.qualified_predicate = 'biolink:causes'
  AND effect.object_aspect_qualifier = 'activity_or_abundance'
  AND effect.object_direction_qualifier = 'decreased'
  AND subject._miner_affects_aa_decreased_gene_degree <= 50
WITH subject, object, count(DISTINCT targeted_gene) AS targeted_disease_genes
WHERE targeted_disease_genes >= 3
RETURN DISTINCT subject.id AS subject_id, object.id AS object_id
"""

[[rules]]
id = "TREAT-I07-R059"
name = "Dual translational assertion causal-target mechanism"
iteration = 7
parent_rule = "TREAT-I05-R030"
status = "retained"
hypothesis = "A causal-target prediction supported independently by both clinical-trial and applied-treatment assertions should form a high-precision discovery rule while retaining an unlabeled prediction."
body = "R030 plus applied_to_treat for the same drug-disease pair"
mechanism_score = "medium"
mechanism_rationale = "Combines directional target perturbation and causal disease genetics with two distinct treatment-oriented assertions, but those assertions are not independent of therapeutic knowledge and disease activity direction remains absent."
uses_treatment_edges = true
trapi_expressibility = "partial"
trapi_notes = "The causal-target, clinical-trial, and applied-treatment motifs are TRAPI-expressible; provenance, evidence rescue, degree, ontology, and negative-existence constraints require Cypher or post-processing."
trapi_template = "trapi/clinical-causal-target.json"
cypher = """
MATCH (subject:Drug)-[:DIRECTLY_PHYSICALLY_INTERACTS_WITH]->(gene:Gene)
      -[:CAUSES]->(object:Disease)
MATCH (subject)-[effect:AFFECTS]->(gene)
MATCH (gene)-[evidence:MINER_GENE_DISEASE_EVIDENCE]->(object)
MATCH (subject)-[trial:IN_CLINICAL_TRIALS_FOR]->(object)
MATCH (subject)-[:APPLIED_TO_TREAT]->(object)
WHERE effect.qualified_predicate = 'biolink:causes'
  AND effect.object_aspect_qualifier = 'activity_or_abundance'
  AND effect.object_direction_qualifier = 'decreased'
  AND subject._miner_affects_aa_decreased_gene_degree <= 50
  AND (
    evidence._miner_gene_causal_disease_degree <= 12
    OR (
      evidence._miner_causal_publication_count >= 3
      AND evidence._miner_causal_publication_npmi >= 0.5
      AND evidence._miner_disease_rank <= 3
    )
  )
  AND 'infores:multiomics-clinicaltrials'
      IN coalesce(trial.primary_knowledge_sources, [])
  AND object.id STARTS WITH 'MONDO:'
  AND coalesce(object._miner_disease_descendant_degree, 0) <= 500
  AND object._miner_disease_superclass_degree >= 1
  AND NOT EXISTS {
    MATCH (subject)-[:HAS_SIDE_EFFECT|CONTRAINDICATED_IN|EXACERBATES_CONDITION|CAUSES]->(object)
  }
RETURN DISTINCT subject.id AS subject_id, object.id AS object_id
"""

