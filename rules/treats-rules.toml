[[rules]]
id = "TREAT-I01-R001"
name = "Affected disease-associated gene baseline"
iteration = 1
status = "baseline"
hypothesis = "A chemical that affects a gene associated with a disease may treat that disease."
body = "chemical -affects-> gene -gene_associated_with_condition-> disease"
mechanism_score = "medium"
mechanism_rationale = "Connects a chemical to a disease-linked gene, but does not require a therapeutically corrective direction or corroborating mechanism."
uses_treatment_edges = false
trapi_expressibility = "full"
trapi_notes = "A two-edge TRAPI query can express the graph pattern; edge-property refinements would require constraints."
cypher = """
MATCH (subject:ChemicalEntity)-[:AFFECTS]->(gene:Gene)
      -[:GENE_ASSOCIATED_WITH_CONDITION]->(object:Disease)
RETURN DISTINCT subject.id AS subject_id, object.id AS object_id
"""

[[rules]]
id = "TREAT-I08-R064"
name = "SemMed treatment-parent with multisource binding and genetic support"
iteration = 8
parent_rule = "TREAT-I07-R063"
status = "retained"
hypothesis = "A SemMed treatment-family assertion becomes highly predictive when a directly inhibited causal target has non-SemMed disease evidence and binding support from at least four resources."
body = "direct inhibited causal target plus SemMed treatment-parent assertion, non-SemMed gene-disease evidence, >=4 binding sources, and non-hub disease"
mechanism_score = "medium"
mechanism_rationale = "Combines a direct perturbation path, causal disease genetics, independent genetic support, and binding consensus; the treatment-family assertion is literature-derived and disease activity direction remains absent."
uses_treatment_edges = true
trapi_expressibility = "partial"
trapi_notes = "The causal-target and treatment-parent motifs are TRAPI-expressible; binding-source cardinality, derived genetic evidence, and disease degree require Cypher."
trapi_template = "trapi/direct-causal-target.json"
family = "direct_causal_translational"
conditions = [
  "pair_treatment_parent_semmed",
  "non_semmed_primary_source_count_>=_1",
  "binding_source_count_>=_4",
  "disease_descendant_degree_<=_500",
]

