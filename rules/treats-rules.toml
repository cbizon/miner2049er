[[rules]]
id = "TREAT-I01-R003"
name = "Affected disease gene with pathway corroboration"
iteration = 1
status = "failed_resource"
hypothesis = "A chemical is more likely to treat a disease when it affects a disease-associated gene that participates in a process containing multiple additional genes associated with the same disease."
body = "chemical -affects-> gene -gene_associated_with_condition-> disease; gene -involved_in-> process <-involved_in- corroborating genes -gene_associated_with_condition-> disease"
mechanism_score = "high"
mechanism_rationale = "Requires a direct chemical target, disease association, and independent pathway-level disease-gene corroboration."
uses_treatment_edges = false
trapi_expressibility = "partial"
trapi_notes = "The branched graph is expressible, but requiring at least two distinct corroborating genes needs post-processing or Cypher."
cypher = """
MATCH (subject:ChemicalEntity)-[:AFFECTS]->(gene:Gene)
      -[:GENE_ASSOCIATED_WITH_CONDITION]->(object:Disease)
MATCH (gene)-[:INVOLVED_IN]->(process)<-[:INVOLVED_IN]-(corroborating_gene:Gene)
      -[:GENE_ASSOCIATED_WITH_CONDITION]->(object)
WHERE corroborating_gene <> gene
WITH subject, object, process, count(DISTINCT corroborating_gene) AS corroborating_genes
WHERE corroborating_genes >= 2
RETURN DISTINCT subject.id AS subject_id, object.id AS object_id
"""

