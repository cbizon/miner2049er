[[rules]]
id = "TREAT-I01-R004"
name = "Phenotype and gene supported indication transfer"
iteration = 1
status = "rejected_zero"
hypothesis = "A treatment for one disease may transfer to another disease when the diseases share several phenotypes and at least one associated gene."
body = "chemical -treats-> anchor disease; anchor disease and candidate disease share >=3 phenotypes and >=1 associated gene"
mechanism_score = "medium"
mechanism_rationale = "Combines phenotypic and genetic disease similarity, but still transfers an indication from an existing treatment rather than deriving a direct drug mechanism."
uses_treatment_edges = true
trapi_expressibility = "partial"
trapi_notes = "The branched paths are expressible; shared-neighbor counts and source-exclusion constraints require post-processing or Cypher."
cypher = """
MATCH (subject:ChemicalEntity)-[treatment:__TARGET_RELATIONSHIPS__]->(anchor:Disease)
WHERE any(
  source IN coalesce(treatment.primary_knowledge_sources, [])
  WHERE NOT source IN [$validation_source, $blind_source]
)
  AND anchor._miner_phenotype_degree >= 3
  AND anchor._miner_phenotype_degree <= 50
MATCH (anchor)-[:HAS_PHENOTYPE]->(phenotype:PhenotypicFeature)
      <-[:HAS_PHENOTYPE]-(object:Disease)
WHERE object <> anchor
  AND object._miner_phenotype_degree >= 3
  AND object._miner_phenotype_degree <= 50
WITH subject, anchor, object,
     count(DISTINCT phenotype) AS shared_phenotypes,
     anchor._miner_phenotype_degree AS anchor_phenotypes,
     object._miner_phenotype_degree AS object_phenotypes
WHERE shared_phenotypes >= 3
  AND toFloat(shared_phenotypes) /
      CASE
        WHEN anchor_phenotypes < object_phenotypes
        THEN anchor_phenotypes
        ELSE object_phenotypes
      END >= 0.5
MATCH (anchor)<-[:GENE_ASSOCIATED_WITH_CONDITION]-(gene:Gene)
      -[:GENE_ASSOCIATED_WITH_CONDITION]->(object)
WITH subject, object, count(DISTINCT gene) AS shared_genes
WHERE shared_genes >= 1
RETURN DISTINCT subject.id AS subject_id, object.id AS object_id
"""

