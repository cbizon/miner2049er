[criteria_sets]
direct_inhibitory_core = "The drug directly physically interacts with a gene, has an AFFECTS assertion that it decreases that gene's activity or abundance, and the gene has graph-derived evidence linking it to the candidate MONDO disease."
translational_channels = "The seven counted drug-disease evidence channels are: APPLIED_TO_TREAT; a Multiomics Clinical Trials IN_CLINICAL_TRIALS_FOR edge; a CTD treatment-family edge; a targeted-text treatment-family edge; a SemMedDB treatment-family edge; targeted-text CONTRIBUTES_TO; and CTD CORRELATED_WITH."
specific_mondo = "The candidate is a MONDO disease with at least one superclass and no more than 500 ontology descendants."
no_direct_adverse = "The graph contains no direct drug-to-disease CONTRAINDICATED_IN, EXACERBATES_CONDITION, CAUSES, CONTRIBUTES_TO, or PREDISPOSES_TO_CONDITION edge."
nonblind_molecular_edges = "The qualifying drug-gene binding and directional effect edges contain neither Drug Repurposing Hub nor TTD among their primary sources."

[[rules]]
id = "TREAT-I01-R001"
description = "Predict that a chemical treats a disease when the chemical affects a gene that is associated with that disease."
criteria = [
  "A ChemicalEntity has an AFFECTS edge to a Gene.",
  "That Gene has a GENE_ASSOCIATED_WITH_CONDITION edge to the candidate Disease.",
  "No direction, binding, degree, provenance, or negative-evidence constraint is imposed.",
]

[[rules]]
id = "TREAT-I02-R006"
description = "Predict that a chemical treats a disease when it decreases the activity or abundance of a gene asserted to cause the disease, provided the chemical is not an extremely broad inhibitor."
criteria = [
  "The chemical has an AFFECTS assertion that causes decreased activity or abundance of a Gene.",
  "That Gene has a CAUSES edge to the candidate Disease.",
  "The chemical has qualifying decreased-activity-or-abundance effects on no more than 50 genes.",
]

[[rules]]
id = "TREAT-I02-R007"
description = "Predict that a chemical treats a disease when it decreases at least two disease-associated genes in the same disease-supported biological process."
criteria = [
  "The disease has a MINER_DISEASE_PROCESS_SUPPORT edge based on 3 through 20 associated genes.",
  "At least two genes counted in that process are associated with the disease and involved in the process.",
  "The chemical decreases the activity or abundance of each counted gene.",
  "The chemical has qualifying decreased effects on no more than 100 genes overall.",
]

[[rules]]
id = "TREAT-I02-R011"
description = "Return a chemical-disease pair whenever the graph says that the chemical is in clinical trials for that disease."
criteria = [
  "A ChemicalEntity has an IN_CLINICAL_TRIALS_FOR edge to the candidate Disease.",
  "No source, phase, status, mechanism, or negative-evidence constraint is imposed.",
]

[[rules]]
id = "TREAT-I02-R013"
description = "Return a chemical-disease pair whenever the graph says that the chemical is applied to treat that disease."
criteria = [
  "A ChemicalEntity has an APPLIED_TO_TREAT edge to the candidate Disease.",
  "No mechanism, provenance, or negative-evidence constraint is imposed.",
]

[[rules]]
id = "TREAT-I02-R015"
description = "Predict that a chemical treats a disease when it both binds and decreases a gene asserted to cause the disease."
criteria = [
  "The chemical directly physically interacts with a Gene.",
  "The same chemical has an AFFECTS assertion that causes decreased activity or abundance of that same Gene.",
  "The Gene has a CAUSES edge to the candidate Disease.",
  "The chemical has qualifying decreased effects on no more than 50 genes overall.",
]

[[rules]]
id = "TREAT-I02-R016"
description = "Predict that a chemical treats a disease when it decreases at least three disease-associated genes in one compact disease-supported process."
criteria = [
  "The disease has a MINER_DISEASE_PROCESS_SUPPORT edge based on 3 through 10 associated genes.",
  "At least three genes counted in that process are associated with the disease and involved in the process.",
  "The chemical decreases the activity or abundance of each counted gene.",
  "The chemical has qualifying decreased effects on no more than 50 genes overall.",
]

[[rules]]
id = "TREAT-I03-R019"
description = "Predict that a drug treats a specific MONDO disease when it binds and decreases a relatively disease-specific causal gene and no direct adverse relation is present."
criteria_sets = ["specific_mondo"]
criteria = [
  "The drug directly physically interacts with a Gene and decreases its activity or abundance.",
  "The Gene has a CAUSES edge to the candidate disease and causes no more than 12 diseases in the graph.",
  "The drug has qualifying decreased effects on no more than 50 genes.",
  "No HAS_SIDE_EFFECT, CONTRAINDICATED_IN, EXACERBATES_CONDITION, or CAUSES edge directly connects the drug to the disease.",
]

[[rules]]
id = "TREAT-I07-R059"
description = "Predict that a drug treats a specific MONDO disease when it inhibits a causal gene and the same drug-disease pair is supported by both an applied-treatment assertion and an independently sourced clinical-trial assertion."
criteria_sets = ["specific_mondo"]
criteria = [
  "The drug directly binds a Gene, decreases its activity or abundance, and the Gene has a CAUSES edge to the disease.",
  "The drug has qualifying decreased effects on no more than 50 genes.",
  "The gene is linked to no more than 12 diseases, or it has at least three causal publications, causal-publication NPMI of at least 0.5, and ranks among the disease's top three genes.",
  "The pair has an APPLIED_TO_TREAT edge and a Multiomics Clinical Trials IN_CLINICAL_TRIALS_FOR edge.",
  "No HAS_SIDE_EFFECT, CONTRAINDICATED_IN, EXACERBATES_CONDITION, or CAUSES edge directly connects the drug to the disease.",
]

[[rules]]
id = "TREAT-I07-R062"
description = "Predict that a drug treats a specific MONDO disease when it selectively inhibits a causal gene, the gene and disease share at least three Bgee-supported anatomical contexts, and the pair has applied-treatment or independent clinical-trial evidence."
criteria_sets = ["specific_mondo"]
criteria = [
  "The drug directly binds a Gene, decreases its activity or abundance, and the Gene has a CAUSES edge to the disease.",
  "The drug has qualifying decreased effects on no more than 30 genes.",
  "The gene-disease evidence records at least three Bgee anatomy overlaps.",
  "The pair has either an APPLIED_TO_TREAT edge or a Multiomics Clinical Trials IN_CLINICAL_TRIALS_FOR edge.",
  "No HAS_SIDE_EFFECT, CONTRAINDICATED_IN, EXACERBATES_CONDITION, or CAUSES edge directly connects the drug to the disease.",
]

[[rules]]
id = "TREAT-I08-R064"
description = "Predict that a drug treats a MONDO disease when it directly inhibits a disease-linked gene, SemMedDB reports a treatment-family relation for the same pair, and both the binding and gene-disease evidence have independent support."
criteria_sets = ["direct_inhibitory_core"]
criteria = [
  "SemMedDB supplies a TREATS_OR_APPLIED_OR_STUDIED_TO_TREAT edge for the same drug-disease pair.",
  "The gene-disease evidence has at least one primary source other than SemMedDB.",
  "The drug-gene binding edges collectively cite at least four distinct primary sources.",
  "The candidate disease has no more than 500 ontology descendants.",
]

