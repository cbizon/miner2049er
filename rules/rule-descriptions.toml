  "The direct gene-disease evidence contains at least three distinct relation types.",
  "At least two publications support the causal gene-disease claim.",
]

[[rules]]
id = "TREAT-I09-R125"
description = "Predict that a drug treats a candidate MONDO disease by transferring a known indication from a different disease, but only when the drug also directly inhibits a gene linked to the candidate and the two diseases share both phenotype and anatomical context."
criteria_sets = ["specific_mondo"]
criteria = [
  "The drug treats or ameliorates an anchor disease through an edge having at least one source other than Drug Repurposing Hub or TTD.",
  "The drug directly physically interacts with a gene and decreases that gene's activity or abundance.",
  "The same gene has graph-derived evidence linking it to the candidate disease.",
  "The anchor and candidate are different diseases that share an exact phenotype occurring in no more than 34 diseases.",
  "The anchor and candidate share an exact anatomy linked to no more than 50 disease locations.",
]

[[rules]]
id = "TREAT-I09-R127"
description = "Predict that a drug treats a specific MONDO disease when the drug directly decreases a compact biological process supported by multiple disease-associated genes."
criteria_sets = ["specific_mondo"]
criteria = [
  "The drug has an AFFECTS assertion that causally decreases a BiologicalProcess.",
  "The disease has a MINER_DISEASE_PROCESS_SUPPORT edge to that same process based on 2 through 20 genes.",
  "The process contains no more than 100 genes.",
]

[[rules]]
id = "TREAT-I09-R138"
description = "Predict that a ChEMBL-flagged prodrug treats a specific MONDO disease when an active drug derived from that prodrug already treats or ameliorates the disease in nonblind sources."
criteria_sets = ["specific_mondo"]
criteria = [
  "An active Drug has a DERIVES_FROM edge to the candidate Drug.",
  "The candidate Drug has chembl_prodrug equal to True.",
  "The active drug has a TREATS or AMELIORATES_CONDITION edge to the disease with at least one source other than Drug Repurposing Hub or TTD.",
]

[[rules]]
id = "TREAT-I09-R139"
description = "Predict that a ChEMBL-flagged prodrug treats a specific MONDO disease when its active drug directly binds and decreases one of the disease's top three graph-supported genes."
criteria_sets = ["specific_mondo"]
criteria = [
  "An active Drug has a DERIVES_FROM edge to the candidate Drug, whose chembl_prodrug property is True.",
  "The active drug directly physically interacts with a Gene and decreases its activity or abundance.",
  "The Gene has graph-derived disease evidence and ranks among the candidate disease's top three genes.",
]

[[rules]]
id = "TREAT-I09-R243"
description = "Predict that a drug treats a specific MONDO disease when it directly inhibits a disease-linked gene that Bgee reports as expressed in the exact cell type where the disease is located."
criteria_sets = ["direct_inhibitory_core", "specific_mondo"]
criteria = [
  "Bgee supplies an EXPRESSED_IN edge from the inhibited gene to a Cell.",
  "The disease has a LOCATED_IN or OCCURS_IN edge to that exact same Cell.",
]

[[rules]]
id = "TREAT-I09-R249"
description = "Predict that a drug treats a specific MONDO disease when it binds and decreases at least three of the disease's top five graph-supported genes and no direct adverse disease relation is present."
criteria_sets = ["specific_mondo"]
criteria = [
  "For each counted Gene, the drug directly physically interacts with it and decreases its activity or abundance.",
  "Each counted Gene ranks among the disease's top five genes in MINER_GENE_DISEASE_EVIDENCE.",
  "At least three distinct qualifying genes are counted.",
  "The graph contains no direct drug-to-disease CONTRAINDICATED_IN, EXACERBATES_CONDITION, or CAUSES edge.",
]

[[rules]]
id = "TREAT-I09-R264"
description = "Predict that a drug treats a specific MONDO disease when it binds and decreases at least two of the disease's top three genes, with at least two evidence items supporting each directional drug-gene effect."
criteria_sets = ["specific_mondo"]
criteria = [
  "For each counted Gene, the drug directly physically interacts with it and decreases its activity or abundance.",
  "Each counted Gene ranks among the disease's top three genes in MINER_GENE_DISEASE_EVIDENCE.",
  "Each qualifying decreased-effect edge has evidence_count of at least two, or at least two listed publications.",
  "At least two distinct qualifying genes are counted.",
]

[[rules]]
id = "TREAT-I09-R265"
description = "Predict that a drug treats a specific MONDO disease when it binds and decreases at least three of the disease's top five genes, with at least two evidence items supporting each directional drug-gene effect."
criteria_sets = ["specific_mondo"]
criteria = [
  "For each counted Gene, the drug directly physically interacts with it and decreases its activity or abundance.",
  "Each counted Gene ranks among the disease's top five genes in MINER_GENE_DISEASE_EVIDENCE.",
  "Each qualifying decreased-effect edge has evidence_count of at least two, or at least two listed publications.",
  "At least three distinct qualifying genes are counted.",
]

[[rules]]
id = "TREAT-I09-R370"
description = "Predict that a drug treats a specific MONDO disease when it binds and repeatedly decreases at least two of the disease's top three genes, and none of those genes also has an opposite increased-activity assertion for the drug."
criteria_sets = ["specific_mondo"]
criteria = [
  "For each counted Gene, the drug directly physically interacts with it and decreases its activity or abundance.",
  "Each counted Gene ranks among the disease's top three genes and each decreased-effect edge has at least two evidence items or publications.",
  "The drug has no AFFECTS assertion that increases the activity or abundance of any counted Gene.",
  "At least two distinct qualifying genes are counted.",
]

[[rules]]
id = "TREAT-I09-R439"
description = "Predict that a drug treats a specific MONDO disease when it binds and decreases a top-three disease gene in a GO pathway genetically associated with the disease, provided the molecular evidence is nonblind and ChEMBL does not record a black-box-warning value."
mechanism_rationale = "The rule combines an independently disease-associated GO process, GOA target membership, a high-ranked disease gene, direct binding, and decreased target activity. The absent ChEMBL black-box-warning property is only a graph filter and is not evidence that the drug is safe."
criteria_sets = ["specific_mondo", "nonblind_molecular_edges"]
criteria = [
  "GeneticsKP supplies a GENETIC_ASSOCIATION between a GO process and the disease.",
  "GOA places the inhibited target Gene in that process.",
  "The target has graph-derived disease evidence and ranks among the disease's top three genes.",
  "The drug directly physically interacts with the target and decreases its activity or abundance.",
  "The drug's chembl_black_box_warning property is absent.",
]

[[rules]]
id = "TREAT-I09-R485"
description = "Predict that a drug treats a specific MONDO disease when it disrupts a disease-associated process, a gene in that process upregulates a top-three disease target, and the drug binds and decreases that target without direct adverse evidence."
trapi_notes = "The positive drug-process, process-gene, signed gene-gene, drug-target, and target-disease paths can be represented in TRAPI. Exact source requirements, target rank, shared-node identity, exclusion of Drug Repurposing Hub and TTD molecular edges, and absence of direct adverse relations require post-processing."
criteria_sets = ["specific_mondo", "nonblind_molecular_edges", "no_direct_adverse"]
criteria = [
  "SemMedDB reports that the drug DISRUPTS a BiologicalProcess genetically associated with the disease by GeneticsKP.",
  "A Gene in that process has a SIGNOR causal REGULATES edge that upregulates a different target Gene.",
  "The target ranks among the disease's top three genes in MINER_GENE_DISEASE_EVIDENCE.",
  "The drug directly physically interacts with the target and decreases its activity or abundance.",
]

[[rules]]
id = "TREAT-I09-R486"
description = "Apply the signed process-interception rule, but reject a drug-disease pair when targeted text mining says the drug causes or contributes to a phenotype or manifestation of that disease."
criteria_sets = ["specific_mondo", "nonblind_molecular_edges", "no_direct_adverse"]
criteria = [
  "SemMedDB reports that the drug disrupts a GeneticsKP disease-associated process.",
  "A Gene in that process upregulates a different top-three disease target through a causal SIGNOR edge.",
  "The drug directly physically interacts with the target and decreases its activity or abundance.",
  "Targeted text mining must not report that the drug CAUSES or CONTRIBUTES_TO an entity that is an HPO-annotated phenotype of the disease or has a MANIFESTATION_OF edge to the disease.",
]

[[rules]]
id = "TREAT-I09-R488"
description = "Predict that a drug treats a specific MONDO disease when it disrupts the direct GO parent of a disease-associated process, a member of the narrower process upregulates a top-three disease target, and the drug binds and decreases that target without direct adverse evidence."
criteria_sets = ["specific_mondo", "nonblind_molecular_edges", "no_direct_adverse"]
criteria = [
  "SemMedDB reports that the drug DISRUPTS a broader BiologicalProcess.",
  "Ubergraph records a direct SUBCLASS_OF edge from a different, narrower process to that broader process.",
  "GeneticsKP genetically associates the narrower process with the disease.",
  "A Gene in the narrower process upregulates a different target through a causal SIGNOR edge.",
  "The target ranks among the disease's top three genes, and the drug directly binds and decreases it.",
]
