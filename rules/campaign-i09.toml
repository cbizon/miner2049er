[[rules]]
id = "TREAT-I09-R155"
name = "Compact active-component causal module"
iteration = 9
status = "candidate"
hypothesis = "A drug can treat a disease when it directly inhibits one causal gene that is active in the same compact cellular component as a second causal disease gene."
body = "drug binds and decreases causal gene; second causal gene shares p90-compact GO active-in component"
mechanism_score = "high"
mechanism_rationale = "ACTIVE_IN localizes the molecular activities of two causal genes to a discrete component, which is stronger functional context than generic component membership, although disease activity direction remains absent."
uses_treatment_edges = false
trapi_expressibility = "partial"
trapi_notes = "The target, causal-gene, and active-in paths are TRAPI-expressible; distinct-gene identity, component degree, and ontology constraints require post-processing."
cypher = """
MATCH (subject:Drug)-[:DIRECTLY_PHYSICALLY_INTERACTS_WITH]->(target:Gene)
MATCH (subject)-[effect:AFFECTS]->(target)
MATCH (target)-[:MINER_GENE_DISEASE_EVIDENCE]->(object:Disease)
MATCH (target)-[:ACTIVE_IN]->(component:CellularComponent)
      <-[:ACTIVE_IN]-(driver:Gene)
MATCH (driver)-[:MINER_GENE_DISEASE_EVIDENCE]->(object)
WHERE target <> driver
  AND effect.qualified_predicate = 'biolink:causes'
  AND effect.object_aspect_qualifier = 'activity_or_abundance'
  AND effect.object_direction_qualifier = 'decreased'
  AND component._miner_component_active_gene_degree <= 185
  AND coalesce(object._miner_disease_descendant_degree, 0) <= 500
  AND object._miner_disease_superclass_degree >= 1
  AND object.id STARTS WITH 'MONDO:'
RETURN DISTINCT subject.id AS subject_id, object.id AS object_id
"""

