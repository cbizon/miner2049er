[[rules]]
id = "TREAT-I09-R094"
name = "Disease-anchored causal pathway module"
iteration = 9
status = "rejected"
hypothesis = "An inhibited causal target is more credible when it and a second causal disease gene occupy a compact process independently associated with the disease."
body = "directly bound and decreased causal target; target and another causal gene share a compact disease-associated process"
mechanism_score = "medium"
mechanism_rationale = "The rule combines direct target perturbation, two causal disease genes, and a disease-anchored process, but the graph does not state whether reduced target activity corrects the disease."
uses_treatment_edges = false
trapi_expressibility = "partial"
trapi_notes = "The positive graph motif is TRAPI-expressible; distinct-gene and process-degree constraints require post-processing."
cypher = """
MATCH (subject:Drug)-[:DIRECTLY_PHYSICALLY_INTERACTS_WITH]->(gene:Gene)
MATCH (subject)-[effect:AFFECTS]->(gene)
MATCH (gene)-[:MINER_GENE_DISEASE_EVIDENCE]->(object:Disease)
MATCH (gene)-[:INVOLVED_IN]->(process)
MATCH (object)-[:GENETIC_ASSOCIATION]-(process)
MATCH (other_gene:Gene)-[:CAUSES]->(object)
MATCH (other_gene)-[:INVOLVED_IN]->(process)
WHERE other_gene <> gene
  AND effect.qualified_predicate = 'biolink:causes'
  AND effect.object_aspect_qualifier = 'activity_or_abundance'
  AND effect.object_direction_qualifier = 'decreased'
  AND process._miner_gene_member_degree <= 100
  AND object.id STARTS WITH 'MONDO:'
RETURN DISTINCT subject.id AS subject_id, object.id AS object_id
"""

