[[rules]]
id = "TREAT-I09-R188"
name = "Dual-effect and multisource-binding GOF inhibition"
iteration = 9
parent_rule = "TREAT-I09-R160"
status = "candidate"
hypothesis = "GOF correction is more credible when direction is supported by two sources and binding by at least four independent sources."
body = "R160 with at least two directional-effect sources and four direct-binding sources"
